<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11160f">
  <title>2026 Rules | Halloween Horror Movie Madness</title>
  <style>
    :root { --bg:#0d100c; --panel:#141a12; --ink:#eee8d9; --muted:#b9b3a4; --acid:#a8c66c; --line:#2c3826; --danger:#b64a3d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 20% 15%, rgba(168,198,108,.07), transparent 34rem),var(--bg); color:var(--ink); font-family:Georgia,"Times New Roman",serif; line-height:1.65; }
    a { color:var(--acid); }
    .wrap { width:min(900px,calc(100% - 2rem)); margin:0 auto; }
    header { border-bottom:1px solid var(--line); padding:1rem 0; }
    nav { display:flex; justify-content:space-between; gap:1rem; align-items:center; }
    .brand { color:var(--muted); text-transform:uppercase; letter-spacing:.12em; font-size:.84rem; text-decoration:none; }
    .year { color:var(--acid); font-weight:700; }
    main { padding:4rem 0 6rem; }
    .kicker { color:var(--acid); text-transform:uppercase; letter-spacing:.2em; font-size:.78rem; font-weight:700; margin:0 0 .8rem; }
    h1 { margin:0; font-size:clamp(2.6rem,8vw,5.8rem); line-height:.95; text-transform:uppercase; letter-spacing:-.03em; }
    .notice { margin-top:2.5rem; padding:1.5rem 1.75rem; background:var(--panel); border-left:3px solid var(--danger); }
    .notice h2 { margin-top:0; }
    .notice p { color:var(--muted); margin-bottom:0; }
    footer { border-top:1px solid var(--line); color:var(--muted); padding:1.5rem 0 3rem; font-size:.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav>
        <a class="brand" href="index.html">Halloween Horror Movie Madness</a>
        <span class="year">Year 18 · 2026</span>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <p class="kicker">2026 Game Rules</p>
    <h1>The Madness Runs the Asylum</h1>
    <section class="notice">
      <h2>Rules are being finalized.</h2>
      <p>The complete 2026 rules, scoring, bonus elements, ATBs and challenge details will live here once the packet is locked.</p>
    </section>
  </main>
  <footer><div class="wrap">Halloween Horror Movie Madness · 2026</div></footer>
</body>
</html>
